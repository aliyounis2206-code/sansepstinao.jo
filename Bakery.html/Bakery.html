<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>San Sebastiano | Premium Basque Cheesecake & Coffee</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700&family=Montserrat:wght@300;400;600;700&display=swap" rel="stylesheet">

  <script type="text/javascript" src="https://cdn.jsdelivr.net/npm/@emailjs/browser@3/dist/email.min.js"></script>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Montserrat', sans-serif;
    }

    :root {
      --bg-dark: #0f0d0e;
      --card-dark: #181516;
      --gold-accent: #d4af37;
      --gold-hover: #f1c40f;
      --text-light: #f5f5f5;
      --text-muted: #a0a0a0;
      --border-dark: #2a2527;
      --primary-font: 'Cinzel', serif;
    }

    body {
      background-color: var(--bg-dark);
      color: var(--text-light);
      display: flex;
      flex-direction: column;
      min-height: 100vh;
      overflow-x: hidden;
    }

    header {
      background-color: rgba(15, 13, 14, 0.95);
      backdrop-filter: blur(10px);
      border-bottom: 1px solid var(--border-dark);
      position: sticky;
      top: 0;
      z-index: 100;
    }

    .navbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      max-width: 1200px;
      margin: 0 auto;
      padding: 1.2rem 2rem;
    }

    .logo {
      font-family: var(--primary-font);
      font-size: 1.6rem;
      font-weight: 700;
      letter-spacing: 2px;
      color: var(--gold-accent);
      text-decoration: none;
    }

    .cart-btn {
      background: transparent;
      border: 1px solid var(--gold-accent);
      color: var(--gold-accent);
      padding: 0.5rem 1.2rem;
      border-radius: 30px;
      cursor: pointer;
      font-size: 0.9rem;
      font-weight: 600;
      display: flex;
      align-items: center;
      gap: 0.5rem;
      transition: all 0.3s ease;
    }

    .cart-btn:hover {
      background: var(--gold-accent);
      color: var(--bg-dark);
    }

    .cart-badge {
      background-color: var(--gold-accent);
      color: var(--bg-dark);
      border-radius: 50%;
      padding: 2px 7px;
      font-size: 0.75rem;
      font-weight: 700;
    }

    .cart-btn:hover .cart-badge {
      background-color: var(--bg-dark);
      color: var(--gold-accent);
    }

    .hero {
      position: relative;
      height: 70vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
      padding: 0 1rem;
      background: linear-gradient(rgba(15, 13, 14, 0.75), rgba(15, 13, 14, 0.95)), 
                  url('https://images.unsplash.com/photo-1533134242443-d4fd215305ad?auto=format&fit=crop&w=1600&q=80') center/cover no-repeat;
      border-bottom: 1px solid var(--border-dark);
    }

    .hero h1 {
      font-family: var(--primary-font);
      font-size: 3.2rem;
      color: var(--gold-accent);
      margin-bottom: 0.8rem;
      letter-spacing: 3px;
    }

    .hero p {
      font-size: 1.1rem;
      color: var(--text-muted);
      max-width: 600px;
      font-weight: 300;
      letter-spacing: 1px;
    }

    .instagram-link {
      margin-top: 1.5rem;
      color: var(--gold-accent);
      text-decoration: none;
      font-size: 0.9rem;
      letter-spacing: 1px;
      border-bottom: 1px solid var(--gold-accent);
      padding-bottom: 2px;
      transition: color 0.3s;
    }

    .instagram-link:hover {
      color: var(--gold-hover);
      border-color: var(--gold-hover);
    }

    main {
      max-width: 1200px;
      margin: 3rem auto;
      padding: 0 1.5rem;
      flex: 1;
      width: 100%;
    }

    .section-title {
      font-family: var(--primary-font);
      text-align: center;
      font-size: 2rem;
      color: var(--text-light);
      margin-bottom: 2rem;
      letter-spacing: 2px;
    }

    .category-filters {
      display: flex;
      justify-content: center;
      gap: 1rem;
      margin-bottom: 3rem;
      flex-wrap: wrap;
    }

    .filter-tab {
      background: transparent;
      border: none;
      color: var(--text-muted);
      font-size: 0.95rem;
      padding: 0.5rem 1.2rem;
      cursor: pointer;
      letter-spacing: 1.5px;
      transition: all 0.3s;
      border-bottom: 2px solid transparent;
    }

    .filter-tab.active, .filter-tab:hover {
      color: var(--gold-accent);
      border-bottom: 2px solid var(--gold-accent);
    }

    .product-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 2rem;
    }

    .product-card {
      background-color: var(--card-dark);
      border: 1px solid var(--border-dark);
      border-radius: 8px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      transition: transform 0.3s ease, border-color 0.3s ease;
    }

    .product-card:hover {
      transform: translateY(-5px);
      border-color: var(--gold-accent);
    }

    .product-img {
      width: 100%;
      height: 240px;
      object-fit: cover;
    }

    .product-details {
      padding: 1.5rem;
      display: flex;
      flex-direction: column;
      flex: 1;
    }

    .product-title {
      font-family: var(--primary-font);
      font-size: 1.2rem;
      margin-bottom: 0.5rem;
      color: var(--text-light);
    }

    .product-desc {
      font-size: 0.85rem;
      color: var(--text-muted);
      margin-bottom: 1.2rem;
      line-height: 1.4;
    }

    .product-bottom {
      margin-top: auto;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .product-price {
      font-size: 1.1rem;
      font-weight: 700;
      color: var(--gold-accent);
    }

    .add-btn {
      background: transparent;
      border: 1px solid var(--gold-accent);
      color: var(--gold-accent);
      padding: 0.5rem 1rem;
      border-radius: 4px;
      cursor: pointer;
      font-size: 0.85rem;
      font-weight: 600;
      transition: all 0.3s ease;
    }

    .add-btn:hover {
      background: var(--gold-accent);
      color: var(--bg-dark);
    }

    .cart-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.8);
      display: none;
      z-index: 200;
    }

    .cart-sidebar {
      position: fixed;
      top: 0;
      right: -420px;
      width: 380px;
      height: 100%;
      background-color: var(--card-dark);
      border-left: 1px solid var(--border-dark);
      z-index: 201;
      transition: right 0.3s ease-in-out;
      display: flex;
      flex-direction: column;
    }

    .cart-sidebar.open {
      right: 0;
    }

    .cart-header {
      padding: 1.5rem;
      border-bottom: 1px solid var(--border-dark);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .cart-header h2 {
      font-family: var(--primary-font);
      color: var(--gold-accent);
    }

    .close-btn {
      background: none;
      border: none;
      color: var(--text-light);
      font-size: 1.8rem;
      cursor: pointer;
    }

    .cart-items {
      flex: 1;
      overflow-y: auto;
      padding: 1.5rem;
    }

    .cart-item {
      display: flex;
      align-items: center;
      margin-bottom: 1.2rem;
      border-bottom: 1px solid var(--border-dark);
      padding-bottom: 0.8rem;
    }

    .cart-item-img {
      width: 60px;
      height: 60px;
      object-fit: cover;
      border-radius: 4px;
      margin-right: 1rem;
    }

    .cart-item-info {
      flex: 1;
    }

    .cart-item-title {
      font-size: 0.95rem;
      font-weight: 600;
      margin-bottom: 0.2rem;
    }

    .cart-item-price {
      font-size: 0.85rem;
      color: var(--gold-accent);
    }

    .qty-controls {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      margin-top: 0.4rem;
    }

    .qty-btn {
      background: var(--border-dark);
      border: none;
      color: var(--text-light);
      width: 22px;
      height: 22px;
      cursor: pointer;
      border-radius: 3px;
    }

    .cart-footer {
      padding: 1.5rem;
      border-top: 1px solid var(--border-dark);
    }

    .cart-total-row {
      display: flex;
      justify-content: space-between;
      font-size: 1.1rem;
      font-weight: 700;
      margin-bottom: 1.2rem;
    }

    .checkout-btn {
      width: 100%;
      background: var(--gold-accent);
      color: var(--bg-dark);
      border: none;
      padding: 0.9rem;
      border-radius: 4px;
      font-weight: 700;
      letter-spacing: 1px;
      cursor: pointer;
      transition: background 0.3s;
    }

    .checkout-btn:hover {
      background: var(--gold-hover);
    }

    .modal {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0,0,0,0.85);
      z-index: 300;
      justify-content: center;
      align-items: center;
      padding: 1rem;
    }

    .modal-content {
      background-color: var(--card-dark);
      border: 1px solid var(--border-dark);
      padding: 2.5rem;
      border-radius: 8px;
      max-width: 500px;
      width: 100%;
      position: relative;
      max-height: 90vh;
      overflow-y: auto;
    }

    .modal-content h2 {
      font-family: var(--primary-font);
      color: var(--gold-accent);
      margin-bottom: 1.5rem;
    }

    .form-group {
      margin-bottom: 1.2rem;
    }

    .form-group label {
      display: block;
      font-size: 0.85rem;
      color: var(--text-muted);
      margin-bottom: 0.4rem;
      letter-spacing: 0.5px;
    }

    .form-group input, .form-group textarea {
      width: 100%;
      padding: 0.75rem;
      background: var(--bg-dark);
      border: 1px solid var(--border-dark);
      border-radius: 4px;
      color: var(--text-light);
      font-size: 0.95rem;
    }

    .form-group input:focus, .form-group textarea:focus {
      outline: none;
      border-color: var(--gold-accent);
    }

    .submit-btn {
      width: 100%;
      background: var(--gold-accent);
      color: var(--bg-dark);
      border: none;
      padding: 0.9rem;
      border-radius: 4px;
      font-weight: 700;
      letter-spacing: 1px;
      cursor: pointer;
      margin-top: 0.5rem;
    }

    .confirmation-details {
      background: var(--bg-dark);
      border: 1px solid var(--border-dark);
      border-radius: 6px;
      padding: 1rem;
      margin: 1.2rem 0;
      text-align: left;
      font-size: 0.9rem;
    }

    .confirmation-details p {
      margin-bottom: 0.4rem;
      color: var(--text-muted);
    }

    .confirmation-details strong {
      color: var(--text-light);
    }

    footer {
      background-color: var(--card-dark);
      border-top: 1px solid var(--border-dark);
      text-align: center;
      padding: 2rem;
      color: var(--text-muted);
      font-size: 0.85rem;
      letter-spacing: 1px;
    }
  </style>
</head>
<body>

  <header>
    <nav class="navbar">
      <a href="#" class="logo">San Sepastiano.jo</a>
      <button class="cart-btn" id="cart-open-btn">
        <span>CART</span>
        <span class="cart-badge" id="cart-count">0</span>
      </button>
    </nav>
  </header>

  <section class="hero">
    <h1>San Sepastiano.jo</h1>
    <p>Authentic Basque Cheesecake & Specialty Coffee • Amman, Jordan</p>
    <a href="https://www.instagram.com/san.sepastiano.jo" target="_blank" class="instagram-link">@san.sepastiano.jo on Instagram</a>
  </section>

  <main>
    <h2 class="section-title">Our Menu</h2>
    
    <div class="category-filters">
      <button class="filter-tab active" onclick="filterCategory('all', event)">All Items</button>
      <button class="filter-tab" onclick="filterCategory('Sweets', event)">Sweets</button>
      <button class="filter-tab" onclick="filterCategory('coffee', event)">Coffee & Drinks</button>
    </div>

    <div class="product-grid" id="product-grid"></div>
  </main>

  <div class="cart-overlay" id="cart-overlay"></div>
  <div class="cart-sidebar" id="cart-sidebar">
    <div class="cart-header">
      <h2>Your Selection</h2>
      <button class="close-btn" id="cart-close-btn">&times;</button>
    </div>
    <div class="cart-items" id="cart-items"></div>
    <div class="cart-footer">
      <div class="cart-total-row">
        <span>Total:</span>
        <span id="cart-total-price">0.00 JOD</span>
      </div>
      <button class="checkout-btn" id="checkout-open-btn">Proceed to Order</button>
    </div>
  </div>

  <div class="modal" id="checkout-modal">
    <div class="modal-content" id="modal-container">
      <button class="close-btn" style="float:right;" id="modal-close-btn">&times;</button>
      <h2>Order Details</h2>
      <form id="checkout-form">
        <div class="form-group">
          <label for="name">Full Name</label>
          <input type="text" id="name" required placeholder="Enter Your Name">
        </div>
        <div class="form-group">
          <label for="phone">Phone Number</label>
          <input type="tel" id="phone" required placeholder="07** *** ***">
        </div>
        <div class="form-group">
          <label for="address">Delivery Address (Amman)</label>
          <textarea id="address" rows="3" required placeholder="Street name, Building number..."></textarea>
        </div>
        <div class="form-group">
          <label for="notes">Order Notes (Optional)</label>
          <textarea id="notes" rows="2" placeholder="Any special requests, allergies, or delivery notes..."></textarea>
        </div>
        <button type="submit" class="submit-btn" id="submit-order-btn">Confirm Order</button>
      </form>
    </div>
  </div>

  <footer>
    <p>&copy; 2026 San Sepastiano Jordan. All Rights Reserved.</p>
  </footer>

  <script>
    const EMAILJS_PUBLIC_KEY = "FV7b1yQKhtDsHSOSc"; 
    const EMAILJS_SERVICE_ID = "service_zmmk97a";
    const EMAILJS_TEMPLATE_ID = "template_925xq5r";

    emailjs.init(EMAILJS_PUBLIC_KEY);

    const products = [
      { 
        id: 1, 
        name: "San Sepastiano", 
        category: "Sweets", 
        price: 15.00, 
        desc: "A traditional Basque burnt cheesecake featuring a light, custard-like center and a beautifully caramelized top, generously laced with rich chocolate sauce.", 
        image: "https://i.ibb.co/7fdz0wm/San-Sepstiano.jpg"
      },
      { 
        id: 2, 
        name: "Cheesecake with mixed berries topping", 
        category: "Sweets", 
        price: 15.00, 
        desc: "Original caramelized creamy Basque cheesecake slice.", 
        image: "https://i.ibb.co/V0h8zGRD/Chesecake.jpg"
      },
      { 
        id: 3, 
        name: "Belgian Chocolate San Sebastiano", 
        category: "Sweets", 
        price: 5.00, 
        desc: "6 Chocolate Cookies Golden crispy on the edges, rich and gooey inside, packed with premium chocolate chunks.", 
        image: "https://i.ibb.co/fVzGK4GP/Cookie.jpg"
      },
      { 
        id: 4, 
        name: "Matilda", 
        category: "Sweets", 
        price: 15.00, 
        desc: "Decadent layered dark chocolate cake drenched in thick chocolate sauce.", 
        image: "https://i.ibb.co/W4VT3h5b/Matelda.jpg"
      },
      { 
        id: 5, 
        name: "Matilda cake with chocolate ganache and mixed berries topping", 
        category: "Sweets", 
        price: 20.00, 
        desc: "Decadent chocolate meets tart berry magic. Rich, creamy ganache studded with white chocolate chips, crowned with a warm cherry pour.", 
        image: "https://i.ibb.co/wH8TfBh/Matelda-with-fruit.jpg"
      },
      { 
        id: 6, 
        name: "Banana bread with caramel sauce sugar-free", 
        category: "Sweets", 
        price: 10.00, 
        desc: "Rich, naturally sweet banana bread drizzled with silky sugar-free caramel.", 
        image: "https://i.ibb.co/svPmgVKJ/banana-cake.jpg" 
      },
      { 
        id: 7, 
        name: "Focaccia 200 g", 
        category: "Sweets", 
        price: 1.25, 
        desc: "House-baked mini focaccia squares brushed with extra virgin olive oil.", 
        image: "https://i.ibb.co/kgRT4FnT/froca.jpg" 
      },
      { 
        id: 8, 
        name: "Mini tart 10 pieces", 
        category: "Sweets", 
        price: 4.00, 
        desc: "Delicate, golden pastry cups piped with smooth pastry cream.", 
        image: "https://i.ibb.co/20VQMF2d/mini-tart.jpg"
      },
      { 
        id: 9, 
        name: "Cappuccino", 
        category: "coffee", 
        price: 3.00, 
        desc: "Expertly brewed espresso topped with a smooth layer of steamed milk.", 
        image: "https://i.ibb.co/DfKJgx9X/Cappuccino.jpg"
      },
      { 
        id: 10, 
        name: "Americano", 
        category: "coffee", 
        price: 2.50, 
        desc: "Espresso extracted over hot water, delivering the depth and complex aroma of a dark roast.", 
        image: "https://i.ibb.co/239xVvdL/Americano.jpg"
      }
    ];

    let cart = [];

    const productGrid = document.getElementById("product-grid");
    const cartOpenBtn = document.getElementById("cart-open-btn");
    const cartCloseBtn = document.getElementById("cart-close-btn");
    const cartSidebar = document.getElementById("cart-sidebar");
    const cartOverlay = document.getElementById("cart-overlay");
    const cartItemsContainer = document.getElementById("cart-items");
    const cartCount = document.getElementById("cart-count");
    const cartTotalPrice = document.getElementById("cart-total-price");
    const checkoutOpenBtn = document.getElementById("checkout-open-btn");
    const checkoutModal = document.getElementById("checkout-modal");
    const modalCloseBtn = document.getElementById("modal-close-btn");
    const checkoutForm = document.getElementById("checkout-form");
    const modalContainer = document.getElementById("modal-container");

    function renderProducts(items) {
      productGrid.innerHTML = items.map(product => `
        <div class="product-card">
          <img src="${product.image}" alt="${product.name}" class="product-img">
          <div class="product-details">
            <h3 class="product-title">${product.name}</h3>
            <p class="product-desc">${product.desc}</p>
            <div class="product-bottom">
              <span class="product-price">${product.price.toFixed(2)} JOD</span>
              <button class="add-btn" onclick="addToCart(${product.id})">ADD TO CART</button>
            </div>
          </div>
        </div>
      `).join('');
    }

    function filterCategory(category, event) {
      document.querySelectorAll('.filter-tab').forEach(tab => tab.classList.remove('active'));
      if(event && event.target) event.target.classList.add('active');

      if (category === 'all') {
        renderProducts(products);
      } else {
        renderProducts(products.filter(p => p.category === category));
      }
    }

    function addToCart(productId) {
      const existing = cart.find(item => item.id === productId);
      if (existing) {
        existing.quantity += 1;
      } else {
        const product = products.find(p => p.id === productId);
        cart.push({ ...product, quantity: 1 });
      }
      updateCartUI();
      openCart();
    }

    function updateQuantity(productId, change) {
      const item = cart.find(i => i.id === productId);
      if (item) {
        item.quantity += change;
        if (item.quantity <= 0) {
          cart = cart.filter(i => i.id !== productId);
        }
      }
      updateCartUI();
    }

    function updateCartUI() {
      const totalCount = cart.reduce((sum, item) => sum + item.quantity, 0);
      cartCount.textContent = totalCount;

      const totalSum = cart.reduce((sum, item) => sum + (item.price * item.quantity), 0);
      cartTotalPrice.textContent = `${totalSum.toFixed(2)} JOD`;

      if (cart.length === 0) {
        cartItemsContainer.innerHTML = '<p style="text-align:center; color: var(--text-muted); margin-top:2rem;">Your cart is currently empty.</p>';
      } else {
        cartItemsContainer.innerHTML = cart.map(item => `
          <div class="cart-item">
            <img src="${item.image}" alt="${item.name}" class="cart-item-img">
            <div class="cart-item-info">
              <div class="cart-item-title">${item.name}</div>
              <div class="cart-item-price">${item.price.toFixed(2)} JOD</div>
              <div class="qty-controls">
                <button class="qty-btn" onclick="updateQuantity(${item.id}, -1)">-</button>
                <span style="font-size:0.85rem;">${item.quantity}</span>
                <button class="qty-btn" onclick="updateQuantity(${item.id}, 1)">+</button>
              </div>
            </div>
          </div>
        `).join('');
      }
    }

    function openCart() {
      cartSidebar.classList.add("open");
      cartOverlay.style.display = "block";
    }

    function closeCart() {
      cartSidebar.classList.remove("open");
      cartOverlay.style.display = "none";
    }

    cartOpenBtn.addEventListener("click", openCart);
    cartCloseBtn.addEventListener("click", closeCart);
    cartOverlay.addEventListener("click", closeCart);

    checkoutOpenBtn.addEventListener("click", () => {
      if (cart.length === 0) {
        alert("Your cart is empty!");
        return;
      }
      closeCart();
      checkoutModal.style.display = "flex";
    });

    modalCloseBtn.addEventListener("click", () => {
      checkoutModal.style.display = "none";
    });

    checkoutForm.addEventListener("submit", async (e) => {
      e.preventDefault();

      const submitBtn = document.getElementById("submit-order-btn");
      submitBtn.disabled = true;
      submitBtn.textContent = "SENDING ORDER...";

      const name = document.getElementById("name").value;
      const phone = document.getElementById("phone").value;
      const address = document.getElementById("address").value;
      const notes = document.getElementById("notes").value || "None";
      const total = cartTotalPrice.textContent;

      const itemsSummaryText = cart.map(i => `${i.name} x ${i.quantity} (${(i.price * i.quantity).toFixed(2)} JOD)`).join('\n');
      const itemsSummaryHTML = cart.map(i => `<li>${i.name} x ${i.quantity}</li>`).join('');

      const templateParams = {
        from_name: name,
        phone: phone,
        address: address,
        order_notes: notes,
        order_items: itemsSummaryText,
        total_price: total
      };

      try {
        await emailjs.send(EMAILJS_SERVICE_ID, EMAILJS_TEMPLATE_ID, templateParams);

        modalContainer.innerHTML = `
          <button class="close-btn" style="float:right;" onclick="resetPage()">&times;</button>
          <div style="text-align: center;">
            <h2 style="color: var(--gold-accent); margin-bottom: 0.5rem;">Order Received!</h2>
            <p style="color: var(--text-muted); font-size: 0.9rem;">Thank you, <strong>${name}</strong>. Your order has been placed successfully!</p>            
            <div class="confirmation-details">
              <p><strong>Phone:</strong> ${phone}</p>
              <p><strong>Address:</strong> ${address}</p>
              <p><strong>Notes:</strong> ${notes}</p>
              <p style="margin-top:0.5rem;"><strong>Order Items:</strong></p>
              <ul style="padding-left: 1.2rem; color: var(--text-light); margin-bottom: 0.5rem;">
                ${itemsSummaryHTML}
              </ul>
              <p style="color: var(--gold-accent); font-size: 1.1rem; margin-top: 0.8rem;"><strong>Total: ${total}</strong></p>
            </div>
            <button class="submit-btn" onclick="resetPage()">Done</button>
          </div>
        `;
        cart = [];
        updateCartUI();
      } catch (error) {
        alert("Failed to send email order. Please double-check your EmailJS Public Key, Service ID, and Template ID.");
        console.error("EmailJS Error:", error);
        submitBtn.disabled = false;
        submitBtn.textContent = "CONFIRM ORDER";
      }
    });

    function resetPage() {
      checkoutModal.style.display = "none";
      location.reload();
    }

    renderProducts(products);
    updateCartUI();
  </script>
</body>
</html>
